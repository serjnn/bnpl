server:
  port: 8081

spring:
  application:
    name: checkout-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bnpl_db?currentSchema=checkout_schema}
    username: ${SPRING_DATASOURCE_USERNAME:bnpl_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:BnplSuperSecretDbPass2026!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: checkout_schema
        default_batch_fetch_size: 20
        format_sql: false
        generate_statistics: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: checkout_schema
    liquibase-schema: checkout_schema

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: checkout-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

bnpl:
  checkout:
    payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8082/v1/payments/charge}
    timeout-ms: 5000
