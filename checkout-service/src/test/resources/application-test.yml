spring:
  datasource:
    url: jdbc:h2:mem:checkout_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 20
        format_sql: false
        generate_statistics: true
  liquibase:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

bnpl:
  checkout:
    payment-service-url: http://localhost:8082/v1/payments/charge
    timeout-ms: 5000
