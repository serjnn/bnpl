server:
  port: 8082

spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bnpl_db?currentSchema=payment_schema}
    username: ${SPRING_DATASOURCE_USERNAME:bnpl_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:BnplSuperSecretDbPass2026!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment_schema
        default_batch_fetch_size: 20
        format_sql: false
        generate_statistics: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: payment_schema
    liquibase-schema: payment_schema

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:BnplRedisSecretPass2026!}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.bnpl.*"

bnpl:
  security:
    webhook-secret: ${HMAC_WEBHOOK_SECRET:whsec_9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c}
    blind-index-pepper: ${CARD_BLIND_INDEX_PEPPER:pep_1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p}
  acquiring:
    gateway-url: ${ACQUIRING_GATEWAY_URL:http://localhost:8082/mock-bank/v1/charge}
    timeout-ms: 4000

resilience4j:
  circuitbreaker:
    instances:
      acquiringBank:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
  timelimiter:
    instances:
      acquiringBank:
        timeout-duration: 4000ms
