server:
  port: 8083

spring:
  application:
    name: schedule-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bnpl_db?currentSchema=schedule_schema}
    username: ${SPRING_DATASOURCE_USERNAME:bnpl_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:BnplSuperSecretDbPass2026!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: schedule_schema
        default_batch_fetch_size: 20
        format_sql: false
        generate_statistics: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: schedule_schema
    liquibase-schema: schedule_schema

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:BnplRedisSecretPass2026!}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: schedule-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.bnpl.*"

bnpl:
  billing:
    cron: ${BNPL_BILLING_CRON:0 0 1 * * ?}
    batch-size: 50
